[package]
name = "ratio-spoof-manager"
version = "2.0.6"
description = "Modern GUI for ratio-spoof"
authors = ["Endymi0n74"]
license = "MIT"
repository = "https://github.com/Endymi0n74/Ratio-Spoof-Manager-Gui"
edition = "2021"
# MSRV dicté par l'écosystème Tauri 2 : `tauri-plugin-process` 2.4 exige
# rustc 1.90 (au-delà, cargo écarte silencieusement le crate et choisirait
# une version bêta). Toolchain réelle : 1.97.1.
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
dashmap = "6"
anyhow = "1"
thiserror = "1"
regex = "1"
dirs = "5"
tauri-plugin-updater = "2.13.2"
tauri-plugin-process = "2.4.0"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
