name: CI

# Intégration continue : clippy (zéro avertissement), tests du backend et build
# complet du livrable (`npm run tauri build -- --no-bundle`, la même chaîne que
# release.yml : engine:fetch → vite build → cargo release) à chaque push sur
# master et à chaque pull request. Un simple espace réservé `dist/` suffit à
# compiler pour clippy et les tests, mais la release étant produite par le même
# `tauri build`, le CI le rejoue : une régression de build (front, build script,
# ressource sidecar) se voit sur le push, pas seulement au moment de publier.
on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"

jobs:
  clippy-tests:
    name: clippy + tests + build (windows-x64)
    runs-on: windows-latest
    steps:
      # actions/checkout et setup-node v5+ tournent nativement sur Node 24 :
      # les épingler en v4 déclenchait l'avertissement « Node.js 20 is
      # deprecated » (runtime forcé sur Node 24). Elles exigent un runner
      # >= v2.327.1, largement dépassé par les runners windows-latest hébergés.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # `tauri::generate_context!` exige que `frontendDist` existe : sans `dist/`,
      # le crate ne compile même pas en profil de test.
      - name: Espace réservé dist
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          if (-not (Test-Path "dist/index.html")) {
            Set-Content -Path "dist/index.html" -Value "<!doctype html><title>placeholder</title>" -NoNewline
          }

      # Le build script Tauri refuse de s'exécuter si la ressource sidecar déclarée
      # est absente, et le test de résolution du moteur vérifie le vrai binaire :
      # même script que release.yml (empreinte vérifiée), sans `npm ci` car il ne
      # dépend que des builtins Node.
      - name: Sidecar (release du moteur, empreinte vérifiée)
        run: node scripts/fetch-engine.mjs

      - name: Clippy (zéro avertissement)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests du backend
        working-directory: src-tauri
        run: cargo test --lib

      # Vite et le CLI Tauri ne sont nécessaires que pour cette étape : `npm ci`
      # est donc positionné ici, après clippy et les tests.
      - name: Dépendances front
        run: npm ci

      # Le livrable doit rester constructible en continu, pas seulement au moment
      # de publier : même commande que release.yml (`beforeBuildCommand` inclus,
      # qui rejoue engine:fetch — sans effet si le sidecar est déjà conforme —
      # puis vite build), sans installateur WiX/NSIS.
      - name: Exécutable release (sans installateur)
        run: npm run tauri build -- --no-bundle

      - name: Vérification du livrable
        shell: pwsh
        run: |
          $exe = "src-tauri/target/release/ratio-spoof-manager.exe"
          if (-not (Test-Path $exe)) { throw "livrable manquant : $exe" }
          Get-Item $exe | Select-Object Name, Length, LastWriteTime
