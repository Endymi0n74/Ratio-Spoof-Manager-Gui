name: CI

on:
  push:
    branches: [ master ]
    tags: [ "gui-v*" ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: RatioSpoofManager-Windows
            path: dist/RatioSpoofManager-Windows-x86_64.zip
          - os: ubuntu-latest
            artifact: RatioSpoofManager-Linux
            path: dist/RatioSpoofManager-Linux-x86_64.tar.gz
          - os: macos-14
            artifact: RatioSpoofManager-macOS
            path: dist/RatioSpoofManager-macOS.zip
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Test GUI helpers
      run: python -m unittest discover -s gui/tests -v

    - name: Install Linux Tk dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk tk-dev

    - name: Build Windows engine
      if: runner.os == 'Windows'
      run: go build -o ratio-spoof.exe .

    - name: Build Unix engine
      if: runner.os != 'Windows'
      run: go build -o ratio-spoof .

    - name: Build Windows GUI
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        python -m pip install -r .\gui\requirements-build.txt
        .\gui\build.ps1 -RatioSpoofExecutable .\ratio-spoof.exe

    - name: Build Linux or macOS GUI
      if: runner.os != 'Windows'
      shell: bash
      run: |
        python -m pip install -r ./gui/requirements-build.txt
        chmod +x ./gui/build.sh
        ./gui/build.sh ./ratio-spoof

    - uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ${{ matrix.path }}

  release:
    if: startsWith(github.ref, 'refs/tags/gui-v')
    needs: [go, desktop]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        pattern: RatioSpoofManager-*
        merge-multiple: true
        path: release-assets

    - name: Add source and checksums
      run: |
        cp gui/ratio_spoof_manager.py release-assets/
        cd release-assets
        sha256sum * > SHA256SUMS.txt

    - name: Publish tagged release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" release-assets/* --generate-notes --title "Ratio Spoof Manager $GITHUB_REF_NAME"
