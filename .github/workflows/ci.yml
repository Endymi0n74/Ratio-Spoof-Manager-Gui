name: CI

on:
  push:
    branches: [ master ]
    tags: [ "gui-v*" ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    - name: Build
      run: go build -v ./...

    - name: Test
      run: go test -v ./...

  windows-gui:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.20'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Test GUI helpers
      run: python -m unittest discover -s gui/tests -v

    - name: Build engine
      run: go build -o ratio-spoof.exe .

    - name: Build GUI
      shell: pwsh
      run: |
        python -m pip install -r .\gui\requirements-build.txt
        .\gui\build.ps1 -RatioSpoofExecutable .\ratio-spoof.exe

    - uses: actions/upload-artifact@v4
      with:
        name: RatioSpoofManager-Windows
        path: dist/RatioSpoofManager-Modern.exe

    - name: Publish tagged release
      if: startsWith(github.ref, 'refs/tags/gui-v')
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create $env:GITHUB_REF_NAME .\dist\RatioSpoofManager-Modern.exe --generate-notes --title "Ratio Spoof Manager $env:GITHUB_REF_NAME"
