name: Release

# Produit le paquet portable Windows x64 (exécutable + sidecar rangé dans binaries/
# + SHA256SUMS), l'installateur NSIS signé et `latest.json` (manifeste lu par
# l'auto-updater), puis publie ces assets sur la release. Un tag v* déclenche la
# chaîne complète ; le déclenchement manuel sert à (re)construire les assets d'un
# tag existant : il build le réf sur lequel il est lancé (`--ref master` par
# défaut, `--ref <tag>` pour une reconstruction fidèle du tag).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release à (re)construire (ex. v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  NODE_VERSION: "20"

jobs:
  portable:
    name: paquet portable windows-x64
    runs-on: windows-latest
    steps:
      # v5+ = runtime Node 24 (plus d'avertissement de dépréciation) ; `cache:
      # npm` reste supporté et l'historique complet du tag reste nécessaire.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dépendances front
        run: npm ci

      - name: Sidecar (release du moteur, empreinte vérifiée)
        run: npm run engine:fetch

      # `tauri::generate_context!` exige que `frontendDist` existe : sans `dist/`,
      # le crate ne compile même pas en profil de test.
      - name: Front (dist pour la compilation du crate)
        run: npm run build

      # Garde-fou : ne rien publier qu'on n'ait vérifié. Ce test vient après
      # `engine:fetch` car la résolution du moteur est testée sur le vrai
      # `src-tauri/binaries/` du dépôt (sinon il n'y aurait rien à résoudre).
      - name: Tests du backend
        working-directory: src-tauri
        run: cargo test --lib

      - name: Clippy (zéro avertissement)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Le bundle NSIS est obligatoire : l'auto-updater n'installe que des
      # installateurs signés (`createUpdaterArtifacts` dans tauri.conf.json), pas
      # le zip portable. La clé privée est donc requise ici — sans elle, le build
      # s'arrête après makensis au moment de signer.
      - name: Exécutable + installateur NSIS signé (auto-updater)
        run: npm run tauri build -- --bundles nsis
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Assembler le paquet portable
        shell: pwsh
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:TAG
          $version = $tag.TrimStart("v")

          # Le tag doit correspondre à la version déclarée, sinon l'archive porterait
          # un numéro de version faux.
          $declared = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($declared -ne $version) {
            throw "Version incohérente : tag $tag mais package.json $declared"
          }

          $name = "ratio-spoof-manager-v$version-windows-x64"
          $stage = "portable/$name"
          $binDir = "$stage/binaries"
          New-Item -ItemType Directory -Force -Path $binDir | Out-Null
          New-Item -ItemType Directory -Force -Path "artifacts" | Out-Null

          Copy-Item "src-tauri/target/release/ratio-spoof-manager.exe" "$stage/"
          Copy-Item "src-tauri/binaries/ratio-spoof-x86_64-pc-windows-msvc.exe" "$binDir/"
          if (Test-Path "packaging/LISEZ-MOI.txt") {
            Copy-Item "packaging/LISEZ-MOI.txt" "$stage/"
          } else {
            Write-Warning "packaging/LISEZ-MOI.txt absent de ce réf : le paquet n'aura pas de mode d'emploi."
          }

          # Empreintes du contenu du paquet (chemins relatifs, fins de ligne LF pour
          # que `sha256sum -c` fonctionne aussi sous Linux/macOS).
          function Write-Checksums($root, $target) {
            $base = (Resolve-Path $root).Path
            $lines = Get-ChildItem $root -Recurse -File | ForEach-Object {
              $rel = $_.FullName.Substring($base.Length + 1).Replace("\", "/")
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $rel"
            }
            [System.IO.File]::WriteAllText($target, (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          }

          Write-Checksums $stage "$stage/SHA256SUMS.txt"

          $zip = "artifacts/$name-portable.zip"
          Compress-Archive -Path $stage -DestinationPath $zip -Force
          Write-Host "Archive : $zip"
          Get-ChildItem $stage -Recurse -File | Select-Object -ExpandProperty FullName

          # Assets de la release : les deux binaires bruts (comme avant) +
          # l'archive + le bundle NSIS (installateur et sa signature updater).
          Copy-Item "src-tauri/target/release/ratio-spoof-manager.exe" "artifacts/"
          Copy-Item "src-tauri/binaries/ratio-spoof-x86_64-pc-windows-msvc.exe" "artifacts/"
          Copy-Item "src-tauri/target/release/bundle/nsis/*" "artifacts/"

          # GitHub stocke les assets en remplaçant les espaces par des points
          # (constaté sur v2.0.4 : `Ratio Spoof Manager_...` publié en
          # `Ratio.Spoof.Manager_...`). On renomme AVANT les empreintes et le
          # manifeste : sinon l'URL de latest.json (espaces → %20) renvoie un
          # 404 au moment d'une mise à jour, et SHA256SUMS liste un nom qui
          # n'existe pas côté release.
          Get-ChildItem "artifacts" -File | Where-Object { $_.Name -match ' ' } | ForEach-Object {
            $newName = $_.Name -replace ' ', '.'
            Rename-Item -Path $_.FullName -NewName $newName
            Write-Host "Asset renomme : $($_.Name) -> $newName"
          }

          # Manifeste de l'auto-updater : ses URLs pointent vers l'installateur
          # signé de cette même release. Il est publié comme asset, ce que lit
          # l'endpoint `releases/latest/download/latest.json` de tauri.conf.json.
          node scripts/make-updater-manifest.mjs `
            --version="$version" `
            --base-url="https://github.com/$env:REPO/releases/download/$tag" `
            --dir=artifacts `
            --notes="Ratio Spoof Manager $tag : voir https://github.com/$env:REPO/releases/tag/$tag"

          # Empreintes de TOUS les assets (hors ce fichier), triées pour rester
          # identiques d'une exécution à l'autre.
          $releaseFiles = Get-ChildItem "artifacts" -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" } |
            Sort-Object Name |
            ForEach-Object Name
          $lines = foreach ($file in $releaseFiles) {
            $hash = (Get-FileHash "artifacts/$file" -Algorithm SHA256).Hash.ToLower()
            "$hash  $file"
          }
          [System.IO.File]::WriteAllText("artifacts/SHA256SUMS.txt", (($lines -join "`n") + "`n"), (New-Object System.Text.UTF8Encoding($false)))
          Get-Content "artifacts/SHA256SUMS.txt"

      - name: Publier la release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
        run: |
          $ErrorActionPreference = "Stop"
          gh release view $env:TAG --json tagName *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $env:TAG déjà publiée : remplacement des assets."
          } else {
            gh release create $env:TAG --title "Ratio Spoof Manager $env:TAG" --generate-notes
          }
          gh release upload $env:TAG artifacts/* --clobber

          # Garde-fou : chaque URL de mise à jour doit réellement résoudre.
          # Un nom d'asset réécrit par GitHub laisserait une release dont
          # l'updater plante au téléchargement — mieux vaut un workflow rouge
          # qu'une mise à jour cassée en silence (404 constaté sur v2.0.4).
          $manifest = Invoke-RestMethod "https://github.com/$env:GH_REPO/releases/download/$env:TAG/latest.json"
          foreach ($platform in $manifest.platforms.PSObject.Properties) {
            $url = $platform.Value.url
            try {
              Invoke-WebRequest -Uri $url -Method Head -UseBasicParsing -ErrorAction Stop | Out-Null
              Write-Host "URL de mise a jour OK ($($platform.Name)) : $url"
            } catch {
              throw "URL de mise a jour inaccessible ($($platform.Name)) : $url — $_"
            }
          }

          gh release view $env:TAG --json url,assets --jq '"\(.url)", (.assets[] | "  \(.name)  \(.size) o  \(.digest)")'
